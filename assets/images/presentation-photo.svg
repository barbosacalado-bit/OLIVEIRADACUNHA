<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="presGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#440D11"/>
      <stop offset="100%" stop-color="#1A0305"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C59D"/>
      <stop offset="100%" stop-color="#B19154"/>
    </linearGradient>
  </defs>
  <rect width="800" height="550" fill="url(#presGrad)"/>
  
  <g transform="translate(250, 100)">
    <!-- Biblioteca Jurídica e Símbolo de Autoridade -->
    <rect x="0" y="30" width="300" height="200" rx="8" fill="#260608" stroke="url(#gold)" stroke-width="2"/>
    <line x1="30" y1="30" x2="30" y2="230" stroke="#D9C59D" stroke-width="2" opacity="0.5"/>
    <line x1="60" y1="30" x2="60" y2="230" stroke="#D9C59D" stroke-width="2" opacity="0.5"/>
    <line x1="90" y1="30" x2="90" y2="230" stroke="#D9C59D" stroke-width="2" opacity="0.5"/>
    <line x1="270" y1="30" x2="270" y2="230" stroke="#D9C59D" stroke-width="2" opacity="0.5"/>
    
    <circle cx="150" cy="130" r="50" fill="url(#gold)"/>
    <path d="M 130,130 L 145,145 L 175,115" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="400" y="400" font-family="'Cinzel', serif" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ADVOCACIA HUMANIZADA E INDIVIDUAL</text>
  <text x="400" y="435" font-family="'Montserrat', sans-serif" font-size="13" fill="#D9C59D" text-anchor="middle" letter-spacing="3">DRA. MARCILENE CUNHA</text>
  <line x1="300" y1="460" x2="500" y2="460" stroke="url(#gold)" stroke-width="2"/>
</svg>