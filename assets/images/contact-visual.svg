<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0A0E"/>
      <stop offset="100%" stop-color="#140203"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C59D"/>
      <stop offset="100%" stop-color="#B19154"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#ctGrad)"/>
  
  <g transform="translate(150, 200)">
    <!-- Ícone de Comunicação e Segurança Jurídica -->
    <rect x="30" y="40" width="240" height="170" rx="16" fill="#240507" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 30,60 L 150,140 L 270,60" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="150" cy="280" r="38" fill="url(#gold)"/>
    <path d="M 140,280 L 148,288 L 162,272" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="300" y="560" font-family="'Cinzel', serif" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">CANAL DIRETO E RESERVADO</text>
  <text x="300" y="595" font-family="'Montserrat', sans-serif" font-size="12" fill="#D9C59D" text-anchor="middle" letter-spacing="2">ATENDIMENTO COM TOTAL SIGILO E ÉTICA</text>
</svg>