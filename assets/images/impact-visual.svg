<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="impGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0E13"/>
      <stop offset="60%" stop-color="#240507"/>
      <stop offset="100%" stop-color="#120102"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C59D"/>
      <stop offset="100%" stop-color="#B19154"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#impGrad)"/>
  
  <!-- Círculos e Linhas Decorativas de Autoridade -->
  <circle cx="300" cy="340" r="230" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="300" cy="340" r="190" fill="none" stroke="#D9C59D" stroke-width="1" opacity="0.25"/>

  <!-- Emblema Monograma Oliveira da Cunha -->
  <g transform="translate(200, 220)">
    <circle cx="100" cy="100" r="95" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M 60,100 C 60,60 140,60 140,100 C 140,140 60,140 60,100 Z" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <text x="100" y="112" font-family="'Cinzel', serif" font-size="34" fill="url(#gold)" text-anchor="middle" font-weight="700">MC</text>
  </g>

  <text x="300" y="520" font-family="'Cinzel', serif" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">DRA. MARCILENE CUNHA</text>
  <text x="300" y="555" font-family="'Montserrat', sans-serif" font-size="13" fill="#D9C59D" text-anchor="middle" letter-spacing="3">ADVOCACIA E CONSULTORIA JURÍDICA</text>
  <line x1="200" y1="580" x2="400" y2="580" stroke="url(#gold)" stroke-width="2"/>
  <text x="300" y="615" font-family="'Montserrat', sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="2">SEGURANÇA • RIGOR TÉCNICO • DEDICAÇÃO</text>
</svg>