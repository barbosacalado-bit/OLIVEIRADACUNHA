  </g>
  <text x="300" y="270" font-family="'Cinzel', serif" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">PROCESSO ADMINISTRATIVO</text>
  <text x="300" y="295" font-family="'Montserrat', sans-serif" font-size="11" fill="#D9C59D" text-anchor="middle" letter-spacing="2">DEFESA E DIREITOS DO SERVIDOR</text>
