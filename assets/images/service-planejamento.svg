<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="planGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D0B0E"/>
      <stop offset="100%" stop-color="#140203"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C59D"/>
      <stop offset="100%" stop-color="#B19154"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#planGrad)"/>
  <!-- Gráfico de Linha e Projeção Estratégica -->
  <g transform="translate(180, 80)">
    <line x1="0" y1="160" x2="240" y2="160" stroke="#D9C59D" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="0" x2="0" y2="160" stroke="#D9C59D" stroke-width="2" opacity="0.4"/>
    <path d="M 10,140 Q 60,130 110,80 T 230,20" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="10" cy="140" r="5" fill="#D9C59D"/>
    <circle cx="110" cy="80" r="6" fill="#B19154"/>
    <circle cx="230" cy="20" r="8" fill="#FFFFFF" stroke="url(#gold)" stroke-width="3"/>
  </g>
  <text x="300" y="320" font-family="'Cinzel', serif" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">PLANEJAMENTO PREVIDENCIÁRIO</text>
  <text x="300" y="350" font-family="'Montserrat', sans-serif" font-size="12" fill="#D9C59D" text-anchor="middle" letter-spacing="2">CÁLCULO CONTRIBUTIVO • REGRAS DE TRANSIÇÃO</text>
</svg>