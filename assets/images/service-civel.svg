<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="civGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#420B0F"/>
      <stop offset="100%" stop-color="#160204"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C59D"/>
      <stop offset="100%" stop-color="#B19154"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#civGrad)"/>
  <!-- Balança da Justiça Cível -->
  <g transform="translate(250, 70)">
    <line x1="50" y1="20" x2="50" y2="180" stroke="url(#gold)" stroke-width="4"/>
    <line x1="10" y1="50" x2="90" y2="50" stroke="url(#gold)" stroke-width="4"/>
    <!-- Prato Esquerdo -->
    <path d="M 10,50 L -15,110 L 35,110 Z" fill="none" stroke="#D9C59D" stroke-width="1.5"/>
    <ellipse cx="10" cy="110" rx="25" ry="6" fill="url(#gold)"/>
    <!-- Prato Direito -->
    <path d="M 90,50 L 65,110 L 115,110 Z" fill="none" stroke="#D9C59D" stroke-width="1.5"/>
    <ellipse cx="90" cy="110" rx="25" ry="6" fill="url(#gold)"/>
    <!-- Base -->
    <ellipse cx="50" cy="180" rx="35" ry="8" fill="url(#gold)"/>
  </g>
  <text x="300" y="320" font-family="'Cinzel', serif" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">DIREITO CÍVEL</text>
  <text x="300" y="350" font-family="'Montserrat', sans-serif" font-size="12" fill="#D9C59D" text-anchor="middle" letter-spacing="2">FAMÍLIA • SUCESSÕES • CONTRATOS • INDENIZAÇÕES</text>
</svg>