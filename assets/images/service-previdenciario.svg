<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E13"/>
      <stop offset="100%" stop-color="#1A0305"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C59D"/>
      <stop offset="100%" stop-color="#B19154"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#pGrad)"/>
  <!-- Ícone do INSS / Previdência estilizado -->
  <circle cx="300" cy="180" r="100" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="300" cy="180" r="75" fill="none" stroke="#D9C59D" stroke-width="1.5" opacity="0.6"/>
  <!-- Proteção da Família e Tempo -->
  <path d="M 260,200 C 260,160 340,160 340,200 L 350,220 L 250,220 Z" fill="url(#gold)" opacity="0.8"/>
  <circle cx="300" cy="150" r="22" fill="url(#gold)"/>
  <path d="M 230,220 L 370,220" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <text x="300" y="320" font-family="'Cinzel', serif" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">DIREITO PREVIDENCIÁRIO</text>
  <text x="300" y="350" font-family="'Montserrat', sans-serif" font-size="12" fill="#D9C59D" text-anchor="middle" letter-spacing="2">BENEFÍCIOS • REVISÕES • APOSENTADORIAS</text>
</svg>