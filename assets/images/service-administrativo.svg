<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="admGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#480D11"/>
      <stop offset="100%" stop-color="#1E0305"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C59D"/>
      <stop offset="100%" stop-color="#B19154"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#admGrad)"/>
  <!-- Brasão / Escudo Institucional do Servidor Público -->
  <g transform="translate(250, 80)">
    <path d="M 50,0 L 100,20 L 100,90 C 100,140 50,170 50,170 C 50,170 0,140 0,90 L 0,20 Z" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M 50,20 L 85,35 L 85,85 C 85,120 50,145 50,145 C 50,145 15,120 15,85 L 15,35 Z" fill="url(#gold)" opacity="0.3"/>
    <!-- Colunas Clássicas -->
    <line x1="35" y1="55" x2="35" y2="115" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="50" y1="55" x2="50" y2="115" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="65" y1="55" x2="65" y2="115" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="25" y1="55" x2="75" y2="55" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="25" y1="115" x2="75" y2="115" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <text x="300" y="320" font-family="'Cinzel', serif" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">DIREITO ADMINISTRATIVO</text>
  <text x="300" y="350" font-family="'Montserrat', sans-serif" font-size="12" fill="#D9C59D" text-anchor="middle" letter-spacing="2">SERVIDORES PÚBLICOS • PAD • CONCURSOS</text>
</svg>