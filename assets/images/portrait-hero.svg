<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D0B0E"/>
      <stop offset="50%" stop-color="#240507"/>
      <stop offset="100%" stop-color="#140203"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9C59D"/>
      <stop offset="50%" stop-color="#B19154"/>
      <stop offset="100%" stop-color="#8E7036"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#B19154" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B19154" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <circle cx="300" cy="320" r="240" fill="url(#glowGrad)"/>

  <!-- Linhas Geométricas Sutis e Elegantes -->
  <circle cx="300" cy="320" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="300" cy="320" r="180" fill="none" stroke="#D9C59D" stroke-width="1" opacity="0.3"/>

  <!-- Silhueta Institucional Elegante da Dra. Marcilene Cunha -->
  <g transform="translate(150, 160)" opacity="0.95">
    <!-- Cabeça e Penteado Profissional -->
    <path d="M 150,90 C 105,90 85,125 80,180 C 76,220 90,260 110,280 C 115,290 120,310 125,335 L 175,335 C 180,310 185,290 190,280 C 210,260 224,220 220,180 C 215,125 195,90 150,90 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Ombros e Terninho de Alfaiataria -->
    <path d="M 60,380 C 20,400 -10,470 -20,560 L 320,560 C 310,470 280,400 240,380 L 190,340 L 150,385 L 110,340 Z" fill="#2E070A" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Lapela em Ouro -->
    <path d="M 110,340 L 150,440 L 190,340 L 170,335 L 150,385 L 130,335 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Assinatura Institucional Inferior -->
  <text x="300" y="650" font-family="'Cinzel', serif" font-size="22" fill="#D9C59D" text-anchor="middle" letter-spacing="4">DRA. MARCILENE CUNHA</text>
  <text x="300" y="680" font-family="'Montserrat', sans-serif" font-size="12" font-weight="300" fill="#FFFFFF" text-anchor="middle" letter-spacing="3" opacity="0.8">ADVOCACIA ESPECIALIZADA</text>
  <line x1="220" y1="695" x2="380" y2="695" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
</svg>
